name: Checks and Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git
        run: |
          git config --global core.autocrlf input

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The plugin needs local IDE installations, so CI builds and tests only core and CLI while linting every module.
      - name: Build, test, and lint
        run: >-
          ./gradlew ktlintCheck :gentrans-core:ktlintCheck :gentrans-cli:ktlintCheck :gentrans-idea-plugin:ktlintCheck
          :gentrans-core:assemble :gentrans-cli:assemble
          :gentrans-core:test :gentrans-cli:test
